name: Build web builds

on:
  workflow_dispatch:
    inputs:
      app:
        description: Which web build
        type: choice
        options: [both, photo, illust]
        default: both
      release:
        description: Make draft GitHub releases of the zips (publish them after the Windows smoke, see README)
        type: boolean
        default: false

# nothing by default; each job asks for what it needs
permissions: {}

jobs:
  build:
    name: build ${{ matrix.app }}
    runs-on: ubuntu-latest
    # the build runs upstream build scripts and our patches: it gets a read-only token
    permissions:
      contents: read
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        app: [photo, illust]
    steps:
      - name: Skip an app not asked for
        id: want
        run: echo "run=${{ inputs.app == 'both' || inputs.app == matrix.app }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.want.outputs.run == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        if: steps.want.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        if: steps.want.outputs.run == 'true'
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: steps.want.outputs.run == 'true'
        with:
          key: ${{ matrix.app }}-${{ hashFiles('pins.json', 'patches/**') }}
          workspaces: work/${{ matrix.app }} -> ../target/${{ matrix.app }}
      - name: Install Trunk 0.21.14
        if: steps.want.outputs.run == 'true'
        run: command -v trunk >/dev/null && trunk --version | grep -q 0.21.14 || cargo install trunk --version 0.21.14 --locked
      - name: Install and unit-test the scripts
        if: steps.want.outputs.run == 'true'
        run: npm ci && npm test
      - name: Build
        if: steps.want.outputs.run == 'true'
        run: node scripts/build.mjs ${{ matrix.app }}
      - name: Brand scan
        if: steps.want.outputs.run == 'true'
        run: node scripts/verify.mjs ${{ matrix.app }}
      - name: Smoke (software renderer; the release gate is the Windows smoke, see README)
        if: steps.want.outputs.run == 'true'
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb >/dev/null
          xvfb-run -a node scripts/smoke.mjs --app ${{ matrix.app }} --site out/${{ matrix.app }}/site --renderer webgl --checks boot,api
      - uses: actions/upload-artifact@v4
        if: steps.want.outputs.run == 'true'
        with:
          name: hanpan-${{ matrix.app }}-web
          path: |
            out/*.zip
            out/*.zip.sha256

  release:
    name: draft releases
    needs: build
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    # the only job with a write token; it runs no build code, only gh on the built zips
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: hanpan-*-web
          path: out
          merge-multiple: true
      - name: Draft a release per built app
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for app in photo illust; do
            zip=$(ls out/hanpan-$app-web-*.zip 2>/dev/null || true)
            [ -n "$zip" ] || continue
            (cd out && sha256sum -c "$(basename "$zip").sha256")
            tag=$(node -e "import('./scripts/lib/pins.mjs').then(m=>console.log(m.releaseTag('$app', m.readPins('pins.json'))))")
            gh release create "$tag" "$zip" "$zip.sha256" --target "$GITHUB_SHA" --draft --title "$tag" --notes-file CHANGES-$app.md
          done
